<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактирование задания</title>
    <style>
        body { font-size: 116.67%; font-family: Arial, sans-serif; background: #1e3c72; color: white; margin: 0; padding: 13.33px; }
        .userbar, .panel { background: rgba(255,255,255,0.08); border-radius: 12px; }
        .userbar { margin-bottom: 20px; padding: 8px 9.33px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .panel { padding: 10.67px; margin-top: 20px; }
        .field { margin-top: 12px; }
        input[type=text], input[type=number], input[type=file], textarea, select {
            font-size: 0.68em; width: 100%; box-sizing: border-box; padding: 8px; border: none; border-radius: 8px; margin-top: 8px; }
        textarea { min-height: 120px; font-family: monospace; }
        button {
            font-size: 0.68em; padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; }
        .primary { background: #fff; color: #1e3c72; font-weight: 700; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        .hint { opacity: 0.85; font-size: 14.67px; margin-top: 6px; }
        .lang-box { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
        .lang-box label { display: flex; gap: 6px; align-items: center; }
        .test-row { padding: 8px; background: rgba(255,255,255,0.06); border-radius: 10px; margin-top: 12px; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .visible-box { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
        pre { background: #00000066; padding: 8px; border-radius: 8px; white-space: pre-wrap; }
        @media (max-width: 800px) { .row-grid { grid-template-columns: 1fr; } }
    
        ::placeholder {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="userbar">
        <span id="userInfo">Редактирование задания</span>
        <button onclick="goBack()">Назад</button>
        <button onclick="logout()">Выйти</button>
    </div>

    <h1>Редактирование задания</h1>

    <div class="panel">
        <div class="field">
            <label for="courseSelect">Курс</label>
            <select id="courseSelect"></select>
            <div class="hint">Можно перенести задание в другой свой курс, включая курс другой группы.</div>
        </div>

        <div class="field">
            <label for="taskTitle">Название задания</label>
            <input type="text" id="taskTitle" placeholder="Например: Лабораторная 1">
        </div>

        <div class="field">
            <label for="taskText">Текст задания</label>
            <textarea id="taskText" placeholder="Введите условие задания"></textarea>
        </div>

        <div class="field">
            <label for="taskMode">Тип задания</label>
            <select id="taskMode" onchange="updateTaskMode()">
                <option value="expected">Только эталонный результат</option>
                <option value="tests">Входные и выходные данные</option>
                <option value="none">Без проверки результата</option>
            </select>
        </div>

        <div class="field" id="expectedBlock">
            <label for="expectedOutputText">Ожидаемый результат</label>
            <textarea id="expectedOutputText" placeholder="Например: a=2&#10;b=3&#10;c=4"></textarea>
        </div>

        <div class="field" id="expectedFileBlock">
            <label for="expectedOutputFile">Или файл с ожидаемым результатом</label>
            <input type="file" id="expectedOutputFile" accept=".txt,.out,.ans,text/plain">
        </div>

        <div class="field" id="testsBlock">
            <label>Тесты input/output</label>
            <div class="hint">Тексты тестов можно редактировать прямо здесь.</div>
            <button type="button" onclick="addTestRow()">Добавить тест</button>
            <div id="testsContainer"></div>
        </div>

        <div class="field">
            <label>Разрешённые языки</label>
            <div class="lang-box">
                <label><input type="checkbox" name="allowed_language" value="c"> C</label>
                <label><input type="checkbox" name="allowed_language" value="cpp"> C++</label>
                <label><input type="checkbox" name="allowed_language" value="go"> Go</label>
            </div>
        </div>

        <div class="field">
            <label for="timeLimit">Ограничение по времени, мс</label>
            <input type="number" id="timeLimit" placeholder="Можно не вводить если нет ограничения">
        </div>

        <div class="field">
            <label for="memoryLimit">Ограничение по памяти, КБ</label>
            <input type="number" id="memoryLimit" placeholder="Можно не вводить если нет ограничения">
        </div>

        <div class="actions">
            <button class="primary" onclick="saveTask()">Сохранить</button>
            <button onclick="goBack()">Отмена</button>
        </div>

        <h3>Результат:</h3>
        <pre id="output"></pre>
    </div>

    <script>
        let testCounter = 0;
        let currentCourseUUID = "";
        let currentTaskUUID = "";

        function getSession() {
            const raw = localStorage.getItem("session");
            if (!raw) return null;
            try { return JSON.parse(raw); } catch { return null; }
        }

        function getParams() {
            return new URLSearchParams(window.location.search);
        }

        function escapeHtml(value) {
            return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
        }

        function logout() {
            localStorage.removeItem("session");
            window.location.href = "index.html";
        }

        function goBack() {
            if (currentCourseUUID) {
                window.location.href = `teacher_course.html?course_uuid=${encodeURIComponent(currentCourseUUID)}`;
                return;
            }
            window.location.href = "teacher.html";
        }

        function updateTaskMode() {
            const mode = document.getElementById("taskMode").value;
            document.getElementById("expectedBlock").style.display = mode === "expected" ? "block" : "none";
            document.getElementById("expectedFileBlock").style.display = mode === "expected" ? "block" : "none";
            document.getElementById("testsBlock").style.display = mode === "tests" ? "block" : "none";
            if (mode === "tests" && document.querySelectorAll(".test-row").length === 0) {
                addTestRow();
            }
        }

        function addTestRow(data = {}) {
            testCounter += 1;
            const id = `test_${testCounter}`;
            const row = document.createElement("div");
            row.className = "test-row";
            row.dataset.testId = id;
            row.innerHTML = `
                <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;">
                    <strong>Тест ${testCounter}</strong>
                    <button type="button" onclick="removeTestRow('${id}')">Удалить</button>
                </div>
                <div class="row-grid">
                    <div>
                        <label>Входные данные</label>
                        <textarea class="test-input-text" placeholder="Текст входных данных"></textarea>
                        <input type="file" class="test-input-file" accept=".txt,.in,.dat,text/plain">
                    </div>
                    <div>
                        <label>Ожидаемый вывод</label>
                        <textarea class="test-output-text" placeholder="Текст ожидаемого вывода"></textarea>
                        <input type="file" class="test-output-file" accept=".txt,.out,.ans,text/plain">
                    </div>
                </div>
                <label class="visible-box">
                    <input type="checkbox" class="test-visible" checked>
                    Показывать студенту
                </label>
            `;
            row.querySelector('.test-input-text').value = data.input || "";
            row.querySelector('.test-output-text').value = data.output || "";
            row.querySelector('.test-visible').checked = data.visible !== false;
            document.getElementById("testsContainer").appendChild(row);
        }

        function removeTestRow(id) {
            const row = document.querySelector(`.test-row[data-test-id="${id}"]`);
            if (row) row.remove();
        }

        async function loadTeacherCourses(selectedCourseUUID = "") {
            const select = document.getElementById("courseSelect");
            const session = getSession();
            try {
                const url = new URL("http://localhost:8081/teacher/course-list");
                url.searchParams.set("user_uuid", session.uuid);
                url.searchParams.set("user_role", session.role);
                const resp = await fetch(url.toString());
                const text = await resp.text();
                if (!resp.ok) {
                    select.innerHTML = `<option value=''>Курсы не загрузились</option>`;
                    return;
                }
                const courses = JSON.parse(text);
                select.innerHTML = "";
                for (const course of courses) {
                    const opt = document.createElement("option");
                    opt.value = course.course_uuid;
                    opt.textContent = `${course.course_name} — ${course.group_name} (${course.tasks_count} заданий)`;
                    if (course.course_uuid === selectedCourseUUID) opt.selected = true;
                    select.appendChild(opt);
                }
            } catch (e) {
                select.innerHTML = `<option value=''>Ошибка загрузки курсов: ${escapeHtml(e)}</option>`;
            }
        }

        async function loadTask() {
            const session = getSession();
            if (!session || session.role !== "teacher") {
                window.location.href = "index.html";
                return;
            }
            document.getElementById("userInfo").textContent = `Пользователь: ${session.name} | Роль: ${session.role}`;

            const params = getParams();
            const courseUUID = params.get("course_uuid");
            const taskUUID = params.get("task_uuid");
            if (!courseUUID || !taskUUID) {
                document.getElementById("output").textContent = "Не указан course_uuid или task_uuid";
                return;
            }
            currentCourseUUID = courseUUID;
            currentTaskUUID = taskUUID;

            await loadTeacherCourses(courseUUID);

            try {
                const url = new URL("http://localhost:8081/teacher/task/edit-data");
                url.searchParams.set("user_uuid", session.uuid);
                url.searchParams.set("user_role", session.role);
                url.searchParams.set("course_uuid", courseUUID);
                url.searchParams.set("task_uuid", taskUUID);
                const resp = await fetch(url.toString());
                const text = await resp.text();
                if (!resp.ok) {
                    document.getElementById("output").textContent = text || "Не удалось загрузить задание";
                    return;
                }
                const data = JSON.parse(text);
                document.getElementById("taskTitle").value = data.task_title || "";
                document.getElementById("taskText").value = data.task_text || "";
                document.getElementById("taskMode").value = data.task_mode || "expected";
                document.getElementById("expectedOutputText").value = data.expected_output || "";
                document.getElementById("timeLimit").value = data.time_limit_ms ?? "";
                document.getElementById("memoryLimit").value = data.memory_limit_kb ?? "";
                const allowed = new Set((data.allowed_languages || []).map(v => String(v)));
                document.querySelectorAll('input[name="allowed_language"]').forEach(cb => cb.checked = allowed.has(cb.value));
                document.getElementById("courseSelect").value = data.course_uuid || courseUUID;

                const testsContainer = document.getElementById("testsContainer");
                testsContainer.innerHTML = "";
                testCounter = 0;
                const tests = Array.isArray(data.tests) ? data.tests : [];
                for (const test of tests) {
                    addTestRow({ input: test.input || "", output: test.output || "", visible: test.visible });
                }
                if (document.querySelectorAll(".test-row").length === 0) {
                    addTestRow();
                }
                updateTaskMode();
                document.getElementById("output").textContent = `Редактируется задание ${data.task_title || data.task_uuid}`;
            } catch (e) {
                document.getElementById("output").textContent = "Ошибка загрузки: " + e;
            }
        }

        async function saveTask() {
            const session = getSession();
            if (!session || session.role !== "teacher") {
                window.location.href = "index.html";
                return;
            }

            const courseUUID = document.getElementById("courseSelect").value.trim();
            const taskTitle = document.getElementById("taskTitle").value.trim();
            const taskText = document.getElementById("taskText").value.trim();
            const taskMode = document.getElementById("taskMode").value;
            const expectedOutputText = document.getElementById("expectedOutputText").value;
            const expectedOutputFile = document.getElementById("expectedOutputFile").files[0];
            const timeLimit = document.getElementById("timeLimit").value.trim();
            const memoryLimit = document.getElementById("memoryLimit").value.trim();
            const output = document.getElementById("output");

            if (!courseUUID || !currentTaskUUID || !currentCourseUUID) {
                output.textContent = "Не хватает идентификаторов курса или задания";
                return;
            }
            if (!taskTitle || !taskText) {
                output.textContent = "Заполни название задания и текст задания";
                return;
            }
            if (taskMode === "expected") {
                if (!expectedOutputText.trim() && !expectedOutputFile) {
                    output.textContent = "Для режима эталонного результата нужно заполнить текст или загрузить файл";
                    return;
                }
            }
            if (taskMode === "tests") {
                const rows = document.querySelectorAll(".test-row");
                if (!rows.length) {
                    output.textContent = "Добавь хотя бы один тест";
                    return;
                }
                for (const row of rows) {
                    const inputText = row.querySelector(".test-input-text").value.trim();
                    const outputText = row.querySelector(".test-output-text").value.trim();
                    const inputFile = row.querySelector(".test-input-file").files[0];
                    const outputFile = row.querySelector(".test-output-file").files[0];
                    if ((!inputText && !inputFile) || (!outputText && !outputFile)) {
                        output.textContent = "В каждом тесте должны быть указаны входные и выходные данные текстом или файлами";
                        return;
                    }
                }
            }

            const formData = new FormData();
            formData.append("user_uuid", session.uuid);
            formData.append("user_role", session.role);
            formData.append("source_course_uuid", currentCourseUUID);
            formData.append("course_uuid", courseUUID);
            formData.append("task_uuid", currentTaskUUID);
            formData.append("task_title", taskTitle);
            formData.append("task_text", taskText);
            formData.append("task_mode", taskMode);
            formData.append("expected_output_text", expectedOutputText);
            formData.append("output_text", expectedOutputText);
            formData.append("time_limit_ms", timeLimit);
            formData.append("memory_limit_kb", memoryLimit);
            if (expectedOutputFile) {
                formData.append("expected_output_file", expectedOutputFile);
                formData.append("output_file", expectedOutputFile);
            }

            if (taskMode === "tests") {
                const rows = document.querySelectorAll(".test-row");
                rows.forEach((row, index) => {
                    formData.append("test_input_text", row.querySelector(".test-input-text").value);
                    formData.append("test_output_text", row.querySelector(".test-output-text").value);
                    formData.append("test_visible", row.querySelector(".test-visible").checked ? "1" : "0");
                    const inputFile = row.querySelector(".test-input-file").files[0];
                    const outputFile = row.querySelector(".test-output-file").files[0];
                    if (inputFile) {
                        formData.append(`test_input_file_${index}`, inputFile);
                    }
                    if (outputFile) {
                        formData.append(`test_output_file_${index}`, outputFile);
                    }
                });
            }

            document.querySelectorAll('input[name="allowed_language"]:checked').forEach(cb => {
                formData.append("allowed_languages", cb.value);
            });

            output.textContent = "Сохранение...";
            try {
                const resp = await fetch("http://localhost:8081/teacher/task/update", {
                    method: "POST",
                    body: formData
                });
                const text = await resp.text();
                output.textContent = text;
                if (resp.ok) {
                    setTimeout(() => {
                        window.location.href = `teacher_course.html?course_uuid=${encodeURIComponent(courseUUID)}`;
                    }, 700);
                }
            } catch (e) {
                output.textContent = "Ошибка: " + e;
            }
        }

        loadTask();
    </script>
</body>
</html>
