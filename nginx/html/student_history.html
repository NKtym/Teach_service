<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>История прохождений</title>
    <style>
        :root {
            --bg: #1e3c72;
            --card: rgba(255,255,255,0.08);
            --card-strong: rgba(255,255,255,0.12);
            --text: #ffffff;
            --muted: rgba(255,255,255,0.8);
            --border: rgba(255,255,255,0.14);
            --danger: #d9534f;
        }

        * { box-sizing: border-box; }

        html, body { font-size: 116.67%; width: 100%; min-height: 100%; }

        body {
            font-size: 116.67%;
            margin: 0;
            padding: 10.67px;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .page { width: 100%; }

        .topbar {
            width: 100%;
            margin-bottom: 16px;
            padding: 8px 9.33px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .topbar-left, .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            font-size: 0.68em;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            background: #ffffff;
            color: #183153;
            font-weight: 700;
            line-height: 1;
        }

        button:hover { opacity: 0.95; }

        .danger {
            background: var(--danger);
            color: #fff;
        }

        .card {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .muted { opacity: 0.85; }

        .meta {
            font-size: 15.33px;
            opacity: 0.95;
            margin-top: 6px;
            color: var(--muted);
            word-break: break-word;
        }

        pre {
            margin: 0;
            background: #00000066;
            padding: 9.33px;
            border-radius: 10px;
            white-space: pre-wrap;
            border: 1px solid rgba(255,255,255,0.12);
            overflow-x: auto;
            min-height: 60px;
            width: 100%;
        }

        .results-wrap {
            width: 100%;
            overflow-x: auto;
            margin-top: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px 6.67px;
            text-align: left;
            vertical-align: top;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            font-size: 15.33px;
        }

        th { background: rgba(255,255,255,0.10); }
        tr:hover td { background: rgba(255,255,255,0.04); }

        h1 { margin-top: 0; }
        .section-title { margin: 0 0 12px 0; }

        .summary {
            margin-top: 12px;
            color: var(--muted);
        }

        @media (max-width: 640px) {
            body { font-size: 116.67%; padding: 8px; }
            .card { padding: 9.33px; }
            .topbar { align-items: stretch; }
            .topbar-left, .topbar-right {
                width: 100%;
                justify-content: space-between;
            }
            button {
                font-size: 0.68em;
                width: 100%;
            }
        }

        ::placeholder {
            font-size: 0.68em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="topbar-left">
                <span id="userInfo">История прохождений</span>
            </div>
            <div class="topbar-right">
                <button onclick="goBackToResults()">Назад к результатам</button>
                <button onclick="logout()">Выйти</button>
            </div>
        </div>

        <h1 id="pageTitle">Загрузка...</h1>
        <div id="pageSubtitle" class="muted"></div>

        <div class="card">
            <h3 class="section-title">Информация о задании</h3>
            <div id="taskMeta"></div>
        </div>

        <div class="card">
            <h3 class="section-title">Студент</h3>
            <div id="studentMeta"></div>
        </div>

        <div class="card">
            <h2 class="section-title">История попыток</h2>
            <div id="summary" class="summary">Загрузка...</div>
            <div id="history"></div>
        </div>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function getSession() {
            const raw = localStorage.getItem("session");
            if (!raw) return null;
            try { return JSON.parse(raw); } catch { return null; }
        }

        function getParams() {
            return new URLSearchParams(window.location.search);
        }

        function logout() {
            localStorage.removeItem("session");
            window.location.href = "index.html";
        }

        function goBackToResults() {
            const params = getParams();
            const courseUUID = params.get("course_uuid");
            const taskUUID = params.get("task_uuid");
            if (courseUUID && taskUUID) {
                window.location.href = `teacher_task.html?course_uuid=${encodeURIComponent(courseUUID)}&task_uuid=${encodeURIComponent(taskUUID)}`;
                return;
            }
            window.location.href = "teacher.html";
        }

        function renderMeta(data) {
            const taskMeta = document.getElementById("taskMeta");
            const studentMeta = document.getElementById("studentMeta");

            taskMeta.innerHTML = `
                <div class="meta">Курс: ${escapeHtml(data.course_name || "")}</div>
                <div class="meta">Группа: ${escapeHtml(data.group_name || "")}</div>
                <div class="meta">Задание: ${escapeHtml(data.task_title || "")}</div>
                <div class="meta">UUID курса: ${escapeHtml(data.course_uuid || "")}</div>
                <div class="meta">UUID задания: ${escapeHtml(data.task_uuid || "")}</div>
                <div class="meta">Режим: ${escapeHtml(data.task_mode || "—")}</div>
                <div class="meta">Языки: ${escapeHtml((data.allowed_languages || []).join(", ") || "не указаны")}</div>
                <div class="meta">Тестов: ${escapeHtml(String(data.tests_count ?? 0))}</div>
            `;

            studentMeta.innerHTML = `
                <div class="meta">Студент: ${escapeHtml(data.student_name || "")}</div>
                <div class="meta">Логин: ${escapeHtml(data.student_login || "")}</div>
                <div class="meta">UUID студента: ${escapeHtml(data.student_uuid || "")}</div>
                <div class="meta">Количество попыток: ${escapeHtml(String(data.attempts_count ?? 0))}</div>
            `;
        }

        function renderHistory(attempts) {
            const summary = document.getElementById("summary");
            const container = document.getElementById("history");

            if (!attempts || !attempts.length) {
                summary.textContent = "У этого студента пока нет попыток по этому заданию.";
                container.innerHTML = "";
                return;
            }

            summary.textContent = `Попыток: ${attempts.length}`;

            let html = `<div class="results-wrap"><table>`;
            html += `<thead><tr>
                <th>#</th>
                <th>Язык</th>
                <th>Версия</th>
                <th>Создано</th>
                <th>Обновлено</th>
                <th>Результат</th>
            </tr></thead><tbody>`;

            for (const item of attempts) {
                html += `<tr>`;
                html += `<td>${escapeHtml(String(item.attempt_number ?? ""))}</td>`;
                html += `<td>${escapeHtml(item.lang || "")}</td>`;
                html += `<td>${escapeHtml(item.lang_version || "")}</td>`;
                html += `<td>${escapeHtml(item.created_at || "")}</td>`;
                html += `<td>${escapeHtml(item.updated_at || "")}</td>`;
                html += `<td><pre>${escapeHtml(item.checker_output || "")}</pre></td>`;
                html += `</tr>`;
            }

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        async function loadHistory() {
            const session = getSession();
            if (!session || session.role !== "teacher") {
                window.location.href = "index.html";
                return;
            }

            document.getElementById("userInfo").textContent = `Пользователь: ${session.name} | Роль: ${session.role}`;

            const params = getParams();
            const courseUUID = params.get("course_uuid");
            const taskUUID = params.get("task_uuid");
            const studentUUID = params.get("student_uuid");

            if (!courseUUID || !taskUUID || !studentUUID) {
                document.getElementById("pageTitle").textContent = "Не хватает параметров";
                document.getElementById("pageSubtitle").textContent = "Не удалось открыть историю прохождений";
                document.getElementById("taskMeta").innerHTML = "";
                document.getElementById("studentMeta").innerHTML = "";
                document.getElementById("summary").textContent = "";
                document.getElementById("history").innerHTML = "";
                return;
            }

            const url = new URL("http://localhost:8081/teacher/course/history");
            url.searchParams.set("user_uuid", session.uuid);
            url.searchParams.set("user_role", session.role);
            url.searchParams.set("course_uuid", courseUUID);
            url.searchParams.set("task_uuid", taskUUID);
            url.searchParams.set("student_uuid", studentUUID);

            const resp = await fetch(url.toString());
            const text = await resp.text();

            if (!resp.ok) {
                document.getElementById("pageTitle").textContent = "Ошибка загрузки";
                document.getElementById("pageSubtitle").textContent = "Не удалось получить историю";
                document.getElementById("summary").textContent = text || "Не удалось загрузить историю";
                document.getElementById("history").innerHTML = "";
                return;
            }

            const data = JSON.parse(text);
            document.getElementById("pageTitle").textContent = data.task_title || "История прохождений";
            document.getElementById("pageSubtitle").textContent = data.student_name ? `${data.student_name}${data.student_login ? ` · ${data.student_login}` : ""}` : "";
            renderMeta(data);
            renderHistory(data.attempts || []);
        }

        loadHistory();
    </script>
</body>
</html>
